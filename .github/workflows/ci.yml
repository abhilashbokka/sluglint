name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Only the two that mean anything: the oldest version pyproject claims
        # to support, and the one the project is developed on. 3.11 and 3.12
        # sat between them and never once failed alone, so they were pure cost.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev,pdf,indic]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Lint (pylint)
        run: pylint src/sluglint
      - name: Test
        run: pytest -q
      - name: Benchmark still runs
        run: python benchmark/run.py > /dev/null
      - name: No em dashes anywhere
        run: |
          if grep -rInP '[\x{2013}\x{2014}]' --include='*.py' --include='*.md' \
               --include='*.yaml' --include='*.yml' --include='*.toml' \
               --include='*.fountain' . ; then
            echo "em or en dash found; use a comma, colon, or full stop" && exit 1
          fi
      - name: Shipped Python source stays ASCII
        run: |
          # tests are exempt: the Indic cases have to carry the scripts they test.
          if grep -rlP '[^\x00-\x7f]' --include='*.py' src ; then
            echo "non-ASCII in src; write it as a \\uXXXX escape" && exit 1
          fi
      - name: Every rule resolves to an implementation
        run: |
          for profile in us-spec-feature tv-pilot shooting-script indian-regional; do
            python -m sluglint.cli rules --check --profile "$profile"
          done
      - name: Lint the fixtures end to end
        run: |
          # clean_pages is the only fixture that must come back clean; the
          # profile fixtures all say "defects injected on purpose" on their own
          # title page, so exit 1 is what passing looks like for them. Asserting
          # 0 there means the fixture stops proving the rule it was written for
          # the moment the rule starts working, which is how the regional one
          # broke: matching a Telugu cue to its Latin spelling is exactly what
          # the indian-regional profile exists to do.
          python -m sluglint.cli lint examples/clean_pages.fountain
          python -m sluglint.cli diff examples/the_last_train.fountain examples/the_last_train_v2.fountain
          for spec in "tv-pilot:night_shift_pilot" \
                      "indian-regional:nadi_regional" \
                      "shooting-script:switching_yard_production"; do
            profile="${spec%%:*}"; fixture="${spec##*:}"
            code=0
            python -m sluglint.cli lint --profile "$profile" "examples/$fixture.fountain" || code=$?
            if [ "$code" -gt 1 ]; then
              echo "$fixture crashed under $profile (exit $code)" && exit 1
            fi
          done

  rulebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev,pdf,indic]"
      - name: README badges match the rulebook
        run: |
          python - <<'PY'
          import re, pathlib, yaml
          book = yaml.safe_load(pathlib.Path("src/sluglint/rulebook.yaml").read_text())
          readme = pathlib.Path("README.md").read_text()
          n_rules = len(book["rules"])
          claimed = int(re.search(r"rulebook-(\d+)%20rules", readme).group(1))
          assert claimed == n_rules, f"README badge says {claimed} rules, rulebook has {n_rules}"
          print(f"OK: {n_rules} rules")
          PY
