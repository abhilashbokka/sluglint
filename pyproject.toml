[project]
name = "sluglint"
version = "0.1.0"
description = "Sluglint: a rule-cited linter for screenplays (format, consistency, and LLM-judged craft rules)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [{ name = "Abhilash Reddy Bokka" }]
keywords = ["screenplay", "screenwriting", "linter", "fountain", "film", "script"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8.0", "ruff>=0.6", "pylint>=3.2"]

[project.urls]
Homepage = "https://github.com/abhilashbokka/sluglint"
Funding = "https://buymeacoffee.com/sluglint"
Issues = "https://github.com/abhilashbokka/sluglint/issues"

[project.scripts]
sluglint = "sluglint.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sluglint = ["rulebook.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET"]
ignore = [
    "E501",    # long lines are readable here; the rulebook prose wraps at 100
    "B905",    # zip(strict=): the pairwise walks are intentionally truncating
    "SIM105",  # contextlib.suppress is not clearer than try/except here
]

[tool.ruff.lint.per-file-ignores]
# Detector modules register themselves by import side effect.
"src/sluglint/lint/__init__.py" = ["F401"]

[tool.pylint.main]
# Detectors are decorator-registered generators; these checks fight that shape
# without catching real defects.
disable = [
    "missing-module-docstring",
    "missing-function-docstring",
    "missing-class-docstring",
    "duplicate-code",
    "too-few-public-methods",
    "too-many-branches",
    "too-many-boolean-expressions",
    "line-too-long",
    # Dataclasses model screenplay elements; the field count is the domain.
    "too-many-instance-attributes",
    # Parser and CLI are flat dispatch by design. Splitting them would hide
    # the element-classification order that makes the parser readable.
    "too-many-locals",
    "too-many-statements",
    "too-many-return-statements",
    # `anthropic` is an optional extra behind a guarded import (tier 3 only).
    "import-outside-toplevel",
    # Tier 3 catches broadly on purpose: an API hiccup must not take down the
    # free tiers, it becomes a notice instead.
    "broad-exception-caught",
]
ignore-paths = ["^examples/.*$"]

[tool.pylint.design]
max-args = 8
max-locals = 20
