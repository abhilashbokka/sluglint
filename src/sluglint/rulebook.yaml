# Sluglint rulebook v0.2 (150 rules)
#
# THE PRODUCT LIVES HERE. Every rule is DATA that the engine dispatches on.
#
# Fields
#   id:        stable identifier. F = format, C = consistency, S = structure/craft,
#              L = language. IDs are permanent; never renumber a shipped rule.
#   tier:      1 = deterministic code, 2 = consistency engine over parsed structure,
#              3 = LLM rubric judge
#   category:  format | consistency | craft | structure | language | production
#   severity:  error | warning | suggestion
#   principle: OUR OWN original formulation of the rule. Never quoted book text.
#   source:    attribution for where the underlying convention is taught. These are
#              inspirations. Nothing here is a citation of reproduced content.
#   detect:    (tier 1/2) key the engine dispatches on. One handler per key.
#   params:    (tier 1/2) thresholds. Never hardcode these in Python.
#   examples:  (tier 3) few-shot violates/acceptable pairs fed to the judge prompt.
#   profiles:  which script profiles the rule applies to. OMITTED = applies to all.
#
# Attribution key
#   Trottier  = David Trottier, "The Screenwriter's Bible" (formatting conventions)
#   Riley     = Christopher Riley, "The Hollywood Standard" (formatting conventions)
#   Field     = Syd Field, "Screenplay" (three-act paradigm)
#   McKee     = Robert McKee, "Story" (craft principles)
#   Snyder    = Blake Snyder, "Save the Cat!" (beats, audience empathy)
#   Goldman   = William Goldman, "Adventures in the Screen Trade" (scene economy)
#   SpecConv  = widely documented US spec-script conventions (public knowledge)
#   ProdConv  = widely documented production / breakdown practice
#   TVConv    = widely documented US television script conventions
#   INConv    = widely documented Indian film industry script conventions

profiles:
  us-spec-feature:
    name: US spec feature
    default: true
    description: >
      A feature screenplay written on spec for the US market. No scene numbers,
      no camera direction, 90-120 pages.
  tv-pilot:
    name: US television pilot
    description: >
      A half-hour or one-hour pilot. Act structure is expected; page bands and
      cold-open/teaser conventions replace the feature length rules.
  shooting-script:
    name: Shooting script
    description: >
      A production draft. Scene numbers are REQUIRED, camera direction is
      permitted, and continuity checks matter more than craft polish.
  indian-regional:
    name: Indian / regional feature
    description: >
      A feature for the Indian market (Telugu, Hindi, Tamil, and others).
      Longer page bands, song sequences, an INTERVAL marker, and code-mixed
      dialogue are conventional rather than defects.

rules:

  # =====================================================================
  # TIER 1: DETERMINISTIC FORMAT LINT
  # Pure code over the parse. 100% precision by construction.
  # =====================================================================

  # ---- scene headings -------------------------------------------------
  - id: F001
    name: Malformed or missing slugline prefix
    tier: 1
    category: format
    severity: error
    detect: slugline_prefix
    principle: >
      Every scene heading must begin with INT., EXT., or INT./EXT. so readers
      and schedulers instantly know where the camera is.
    source: Trottier; Riley; SpecConv

  - id: F002
    name: Scene heading missing time of day
    tier: 1
    category: format
    severity: warning
    detect: missing_time_of_day
    principle: >
      A slugline should end with a time marker (DAY, NIGHT, CONTINUOUS, ...)
      after a spaced hyphen; production planning depends on it.
    source: Trottier; SpecConv

  - id: F010
    name: Scene heading not in uppercase
    tier: 1
    category: format
    severity: warning
    detect: heading_not_uppercase
    principle: >
      Scene headings are set in full capitals. A lowercase heading breaks the
      visual scan that lets a reader find the top of a scene at a glance.
    source: Trottier; Riley; SpecConv

  - id: F011
    name: Non-standard time-of-day token
    tier: 1
    category: format
    severity: suggestion
    detect: nonstandard_time_of_day
    principle: >
      Time markers should come from the conventional set (DAY, NIGHT, DAWN,
      DUSK, MORNING, EVENING, CONTINUOUS, LATER, SAME). Invented markers
      break automated breakdowns even when a human understands them.
    source: Riley; ProdConv

  - id: F012
    name: Scene heading with no location
    tier: 1
    category: format
    severity: error
    detect: empty_location
    principle: >
      A heading must name a place between the prefix and the time marker. A
      heading of just INT. - DAY tells nobody where the scene happens.
    source: Trottier; SpecConv

  - id: F013
    name: Overlong scene heading
    tier: 1
    category: format
    severity: suggestion
    detect: overlong_heading
    params: {max_chars: 60}
    principle: >
      A heading names a place, not a situation. Description that runs past
      roughly sixty characters belongs in the action line underneath it.
    source: Riley; ProdConv

  - id: F014
    name: Non-standard scene heading separator
    tier: 1
    category: format
    severity: suggestion
    detect: heading_separator
    principle: >
      Heading segments are divided by a spaced hyphen. Unspaced hyphens, long
      dashes, and commas defeat the parsers that build shooting schedules.
    source: Riley; ProdConv

  - id: F015
    name: Duplicate consecutive scene heading
    tier: 1
    category: format
    severity: warning
    detect: duplicate_consecutive_heading
    principle: >
      Two identical headings back to back are one scene that got split by a
      stray line break, or a paste error. Either way it inflates the scene
      count and the schedule.
    source: ProdConv

  # ---- dialogue blocks ------------------------------------------------
  - id: F003
    name: Orphaned character cue
    tier: 1
    category: format
    severity: error
    detect: orphan_cue
    principle: >
      A character cue must be followed by dialogue (or a parenthetical plus
      dialogue). A cue with nothing under it is a formatting defect.
    source: SpecConv

  - id: F016
    name: Unbroken dialogue block
    tier: 1
    category: format
    severity: suggestion
    detect: long_dialogue_block
    params: {max_lines: 6}
    principle: >
      A speech that runs many lines without a beat, an interruption, or a
      break reads as a monologue on the page whether or not it plays as one.
      Break it or motivate its length.
    source: Trottier; McKee

  - id: F017
    name: Overlong parenthetical
    tier: 1
    category: format
    severity: suggestion
    detect: long_parenthetical
    params: {max_words: 5}
    principle: >
      A parenthetical is a short qualifier, not a stage direction. Anything
      past a few words is action and belongs on its own line.
    source: Trottier; Riley

  - id: F018
    name: Parenthetical after the final line of dialogue
    tier: 1
    category: format
    severity: warning
    detect: trailing_parenthetical
    principle: >
      A parenthetical modifies the dialogue that follows it. One left dangling
      after the last line of a speech modifies nothing.
    source: Riley; SpecConv

  - id: F019
    name: Consecutive cues for the same character
    tier: 1
    category: format
    severity: warning
    detect: consecutive_same_cue
    principle: >
      The same character cued twice in a row with no intervening action or
      other speaker is a split that should be one speech, or a missing beat.
    source: SpecConv

  - id: F020
    name: Character cue carrying a description
    tier: 1
    category: format
    severity: warning
    detect: cue_with_description
    principle: >
      A cue is a name plus an optional extension in parentheses. Appositives
      and job titles inside the cue ("JOHN, THE BARBER") fragment the
      character registry that every downstream breakdown depends on.
    source: Trottier; ProdConv

  - id: F021
    name: Non-standard character extension
    tier: 1
    category: format
    severity: suggestion
    detect: nonstandard_extension
    principle: >
      Extensions are drawn from a small conventional set: V.O., O.S., O.C.,
      CONT'D, and combinations of them. Spelled-out or invented extensions
      are read as part of the name by parsing software.
    source: Riley; SpecConv

  - id: F022
    name: Dual-dialogue marker without a partner
    tier: 1
    category: format
    severity: error
    detect: orphan_dual_dialogue
    principle: >
      A dual-dialogue marker declares that this speech is simultaneous with
      the one immediately before it. With no preceding speech there is
      nothing to be simultaneous with.
    source: SpecConv

  - id: F023
    name: Probable character cue written in mixed case
    tier: 1
    category: format
    severity: warning
    detect: probable_lowercase_cue
    principle: >
      A line that carries a known character's name, stands alone, and is
      followed by speech is a cue that lost its capitals. Left as is, that
      character's lines silently vanish from the registry.
    source: SpecConv

  # ---- document hygiene ----------------------------------------------
  - id: F024
    name: Empty scene
    tier: 1
    category: format
    severity: warning
    detect: empty_scene
    principle: >
      A heading with no action and no dialogue under it is a placeholder that
      escaped into the draft. It still costs a scene number and a schedule row.
    source: ProdConv

  - id: F025
    name: Pagination artifacts from a converted draft
    tier: 1
    category: format
    severity: warning
    detect: pagination_artifacts
    principle: >
      (MORE), a bare (CONT'D) on its own line, CONTINUED:, and stray page
      numbers are artifacts of pagination. When they survive a PDF or
      production-draft conversion they corrupt the next repagination.
    source: ProdConv

  - id: F026
    name: Tabs or exotic whitespace in the source
    tier: 1
    category: format
    severity: suggestion
    detect: whitespace_artifacts
    principle: >
      Screenplay layout comes from margins, not from tabs or non-breaking
      spaces. Embedded whitespace characters shift elements unpredictably
      when the file moves between programs.
    source: ProdConv

  - id: F027
    name: Typographic characters production software mishandles
    tier: 1
    category: format
    severity: suggestion
    detect: smart_typography
    principle: >
      Curly quotes, long dashes, and single-glyph ellipses are inserted
      by word processors and are still mangled by parts of the production
      chain. Straight quotes and plain hyphens travel safely.
    source: ProdConv

  - id: F028
    name: Unbalanced brackets or quotes
    tier: 1
    category: format
    severity: warning
    detect: unbalanced_delimiters
    principle: >
      An unclosed parenthesis or bracket means an edit was interrupted. It
      also silently swallows an extension or a parenthetical when the file is
      parsed.
    source: SpecConv

  - id: F029
    name: Incomplete title page
    tier: 1
    category: format
    severity: suggestion
    detect: title_page_incomplete
    params: {required: [title, author, contact], min_pages: 5}
    principle: >
      A submitted script carries a title, a byline, and a way to reach the
      writer. A draft that circulates without contact information cannot be
      followed up on.
    source: Trottier; SpecConv

  - id: F030
    name: Missing opening marker
    tier: 1
    category: format
    severity: suggestion
    detect: missing_fade_in
    params: {min_pages: 5}
    principle: >
      Convention opens a screenplay with FADE IN: (or an equivalent opening
      marker). Starting cold on a slugline reads as an excerpt rather than a
      complete draft.
    source: Trottier; SpecConv

  - id: F031
    name: Non-standard transition token
    tier: 1
    category: format
    severity: suggestion
    detect: nonstandard_transition
    principle: >
      Transitions come from a small documented set (CUT TO:, DISSOLVE TO:,
      SMASH CUT TO:, MATCH CUT TO:, FADE OUT.). Invented transitions read as
      direction rather than punctuation.
    source: Riley; SpecConv

  # ---- style metrics --------------------------------------------------
  # THRESHOLD SET FROM MEASUREMENT, not from the taught ideal. Across 18,299
  # action paragraphs in 19 produced screenplays the distribution runs: 90% at
  # three lines or fewer, 95% at four, 98% at six, 99% at eight. Four lines is
  # therefore the 95th percentile of what gets shot, so flagging it called one
  # paragraph in eighteen a defect and buried the genuine walls. Seven flags
  # the top 1.4%, which is what a reader actually balks at. A writer who wants
  # the stricter convention sets it in .sluglint.yaml:
  #     params: {F004: {max_lines: 4}}
  - id: F004
    name: Wall-of-text action block
    tier: 1
    category: format
    severity: warning
    detect: long_action_block
    params: {max_lines: 7}
    principle: >
      Action paragraphs longer than about four lines read as a wall of text
      and slow the read; break them at each new visual beat.
    source: Trottier; SpecConv

  - id: F005
    name: Camera direction in a spec script
    tier: 1
    category: format
    severity: suggestion
    detect: camera_direction
    profiles: [us-spec-feature, tv-pilot, indian-regional]
    principle: >
      Spec scripts should not direct the camera (ANGLE ON, CLOSE UP, PAN,
      ZOOM, DOLLY). Describe what we see; let the director shoot it.
    source: Trottier; SpecConv

  - id: F006
    name: Transition overuse
    tier: 1
    category: format
    severity: suggestion
    detect: transition_overuse
    params: {max_per_10_scenes: 3}
    principle: >
      In a modern spec, a cut is implied between scenes. Frequent CUT TO:
      style transitions are noise; reserve them for deliberate effect.
    source: Trottier; SpecConv

  - id: F007
    name: Parenthetical overuse
    tier: 1
    category: format
    severity: suggestion
    detect: parenthetical_overuse
    params: {max_ratio: 0.30, min_cues: 10}
    principle: >
      If a large share of dialogue blocks carry actor direction in
      parentheses, the dialogue is not doing its job; the line itself should
      imply its delivery.
    source: Trottier; McKee

  - id: F008
    name: Feature length outside the standard band
    tier: 1
    category: format
    severity: warning
    detect: page_count
    params: {min_pages: 85, max_pages: 125}
    profiles: [us-spec-feature, shooting-script]
    principle: >
      A feature spec is expected to land roughly between 90 and 120 pages at
      one page per minute of screen time; well outside that band invites an
      automatic pass. Deliberately NOT retuned from the corpus, unlike C021,
      C028, and C038. Produced screenplays run past this ceiling more than
      half the time, but a produced screenplay is a later artifact than the
      draft this rule addresses: scripts are bought at 120 pages and shot at
      150. Measuring the wrong population would have moved the number without
      improving it. This band needs a corpus of specs as submitted, which is
      the one corpus nobody can obtain.
    source: Field; SpecConv

  - id: F009
    name: Scene numbers in a spec draft
    tier: 1
    category: format
    severity: suggestion
    detect: scene_numbers
    params: {profile_mismatch_share: 0.6}
    profiles: [us-spec-feature, tv-pilot, indian-regional]
    principle: >
      Scene numbers belong to shooting scripts. A spec draft with numbered
      sluglines signals an amateur or a repurposed production draft.
    source: Trottier; SpecConv

  - id: F032
    name: ALL-CAPS overuse in action
    tier: 1
    category: format
    severity: suggestion
    detect: caps_overuse
    params: {max_ratio: 0.15, min_action_lines: 20}
    principle: >
      Capitals mark a first appearance, a sound, or a key prop. Used on
      ordinary emphasis they stop marking anything, and the reader's eye
      loses the signal it was trained to catch.
    source: Trottier; Riley

  - id: F033
    name: Exclamation-mark overuse
    tier: 1
    category: format
    severity: suggestion
    detect: exclamation_overuse
    params: {max_per_page: 2.0, min_pages: 5}
    principle: >
      Volume on the page is not intensity on the screen. Exclamation marks
      scattered through action and dialogue direct performance the writer
      does not control.
    source: Trottier

  - id: F034
    name: Ellipsis overuse in dialogue
    tier: 1
    category: format
    severity: suggestion
    detect: ellipsis_overuse
    params: {max_ratio: 0.20, min_lines: 20}
    principle: >
      An ellipsis marks a trail-off. On a large share of lines it becomes a
      verbal tic shared by every character, which flattens them all.
    source: SpecConv

  - id: F035
    name: Reader address in action lines
    tier: 1
    category: format
    severity: suggestion
    detect: reader_address
    principle: >
      Action describes the frame, not the act of watching it. "We see", "we
      hear", and "the camera finds" put a narrator between the reader and
      the image.
    source: Trottier; McKee

  - id: F036
    name: Dialogue-to-action balance outside the normal band
    tier: 1
    category: production
    severity: suggestion
    detect: dialogue_ratio
    params: {min_ratio: 0.20, max_ratio: 0.70, min_lines: 100}
    principle: >
      The share of the page given to speech is a measurable property of a
      draft. Far outside the usual band it signals a script that is either a
      radio play or a silent film, and it is worth knowing on purpose.
    source: ProdConv

  - id: F037
    name: Scene density outside the normal band
    tier: 1
    category: production
    severity: suggestion
    detect: scene_density
    params: {min_per_page: 0.3, max_per_page: 2.0, min_pages: 10}
    principle: >
      Scenes per page is a proxy for cutting rhythm and for company moves. An
      unusually high or low count is not wrong, but it should be a decision
      rather than an accident.
    source: ProdConv

  - id: F038
    name: Emphasis markup in action
    tier: 1
    category: format
    severity: suggestion
    detect: emphasis_markup
    params: {max_count: 10}
    principle: >
      Bold, italic, and underline are inconsistently supported across the
      production chain and read as an author shouting. Capitals and sentence
      structure carry emphasis that survives every conversion.
    source: Riley; ProdConv

  # ---- profile: shooting script --------------------------------------
  - id: F039
    name: Shooting script without scene numbers
    tier: 1
    category: production
    severity: error
    detect: missing_scene_numbers
    profiles: [shooting-script]
    principle: >
      A production draft is referenced by scene number in every department,
      call sheet, and continuity report. Unnumbered scenes make the draft
      unusable on a set.
    source: ProdConv

  - id: F040
    name: Scene numbers duplicated or out of sequence
    tier: 1
    category: production
    severity: error
    detect: scene_number_sequence
    profiles: [shooting-script]
    principle: >
      Scene numbers must be unique and ascending. Inserted scenes take letter
      suffixes (14A) rather than renumbering, because every department's
      paperwork is already keyed to the old numbers.
    source: ProdConv

  # ---- profile: TV pilot ----------------------------------------------
  - id: F041
    name: Pilot missing act structure markers
    tier: 1
    category: structure
    severity: warning
    detect: missing_act_markers
    profiles: [tv-pilot]
    principle: >
      A television script is delivered in labelled acts (COLD OPEN or TEASER,
      then ACT ONE onward). Without the labels the script cannot be timed
      against a broadcast or platform format.
    source: TVConv

  - id: F042
    name: Act length imbalance
    tier: 1
    category: structure
    severity: suggestion
    detect: act_length_balance
    params: {max_ratio: 2.5}
    profiles: [tv-pilot]
    principle: >
      Acts in a pilot run to roughly comparable lengths. One act several
      times the size of another usually means an act break landed in the
      wrong place rather than that the story demanded it.
    source: TVConv

  - id: F043
    name: Pilot length outside the format band
    tier: 1
    category: format
    severity: warning
    detect: pilot_page_count
    params: {half_hour: [22, 40], hour: [45, 70], split_at: 42}
    profiles: [tv-pilot]
    principle: >
      Half-hour and one-hour pilots have distinct expected page bands. A
      draft between the two bands, or outside both, cannot be slotted into
      either format without a rewrite.
    source: TVConv

  # ---- profile: Indian / regional -------------------------------------
  - id: F044
    name: Song sequence not marked as a formatted block
    tier: 1
    category: format
    severity: warning
    detect: song_cue_format
    profiles: [indian-regional]
    principle: >
      A song sequence is a production unit with its own schedule, unit, and
      budget line. It must be marked as a labelled block (SONG:, SONG
      SEQUENCE, or an equivalent header) rather than buried in action.
    source: INConv; ProdConv

  - id: F045
    name: INTERVAL marker missing or badly placed
    tier: 1
    category: structure
    severity: suggestion
    detect: interval_marker
    params: {expected_at: 0.5, tolerance: 0.12}
    profiles: [indian-regional]
    principle: >
      A theatrical feature for the Indian market carries an INTERVAL near the
      midpoint, and the beat before it is written to carry the audience back
      after the break. A missing or badly placed marker means the structure
      was not planned around it.
    source: INConv

  - id: F046
    name: Character cue mixing writing systems
    tier: 1
    category: consistency
    severity: warning
    detect: mixed_script_cue
    profiles: [indian-regional]
    principle: >
      A code-mixed draft may set cues in Latin or in a native script, but it
      must pick one. The same character cued in two writing systems becomes
      two characters in every breakdown.
    source: INConv; ProdConv

  # =====================================================================
  # TIER 2: CONSISTENCY ENGINE
  # Registries, timeline, fuzzy matching over the parsed structure.
  # =====================================================================

  # ---- character identity ---------------------------------------------
  - id: C001
    name: Character name drift
    tier: 2
    category: consistency
    severity: error
    detect: name_drift
    params: {similarity_threshold: 0.80}
    principle: >
      One character, one spelling. Near-identical cue names (JON vs JOHN,
      RAJU vs RAJ) almost always mean typo drift between drafts, and they
      fracture every downstream breakdown.
    source: SpecConv; ProdConv

  - id: C002
    name: Vanishing character
    tier: 2
    category: consistency
    severity: warning
    detect: vanishing_character
    params: {min_scenes: 3, last_seen_before: 0.65}
    principle: >
      A character established across several scenes who silently disappears
      for the final act is usually an unresolved thread from a rewrite.
    source: McKee (causality of setups and payoffs)

  - id: C003
    name: Speaking character never introduced in action
    tier: 2
    category: consistency
    severity: warning
    detect: uninitialized_character
    principle: >
      A character should be introduced in an action line (name in CAPS at
      first appearance, ideally with age/essence) before their first line of
      dialogue; otherwise the reader meets a voice with no body.
    source: Trottier; SpecConv

  - id: C006
    name: Named character with a single line
    tier: 2
    category: consistency
    severity: suggestion
    detect: single_use_character
    principle: >
      Naming a character tells the reader (and casting) to remember them. A
      one-line walk-on is usually better served by a role name (WAITER,
      NURSE).
    source: SpecConv; ProdConv

  - id: C007
    name: Character re-introduced as if new
    tier: 2
    category: consistency
    severity: warning
    detect: duplicate_introduction
    principle: >
      A character gets one capitalised introduction. A second one, pages
      later, means two passes of the draft each thought they were meeting
      this person first.
    source: Trottier; SpecConv

  - id: C008
    name: Named in action but never heard from
    tier: 2
    category: consistency
    severity: suggestion
    detect: orphan_mention
    principle: >
      A name introduced in capitals promises a person the reader should
      track. One who never speaks and never returns is either a rewrite
      orphan or should be an unnamed role.
    source: McKee (setup and payoff, reworded); ProdConv

  - id: C012
    name: Name drift between action lines and cues
    tier: 2
    category: consistency
    severity: warning
    detect: action_name_drift
    params: {similarity_threshold: 0.80}
    principle: >
      The spelling in the action line and the spelling in the cue must match
      exactly. A character called MEERA in cues and "Meerah" in action reads
      fine and breaks every script-to-schedule tool.
    source: ProdConv

  - id: C013
    name: Age stated two different ways
    tier: 2
    category: consistency
    severity: warning
    detect: age_drift
    principle: >
      A character's stated age is a casting instruction. Two different
      answers in the same draft leave casting to guess which one survived the
      last rewrite.
    source: ProdConv

  - id: C017
    name: Character heard only in voice-over
    tier: 2
    category: consistency
    severity: suggestion
    detect: vo_only_character
    principle: >
      A character who exists only as a voice-over is a deliberate choice or a
      scene that got cut. Flagging it makes the choice explicit before a
      casting breakdown treats them as an on-camera role.
    source: ProdConv

  - id: C018
    name: Extension drift inside one scene
    tier: 2
    category: consistency
    severity: suggestion
    detect: extension_drift
    principle: >
      Within a single scene a character is either present, off screen, or on
      a voice-over. Switching between extensions with no action to justify
      the move is a continuity error rather than a choice.
    source: Riley; ProdConv

  - id: C020
    name: Speaking cast size relative to length
    tier: 2
    category: production
    severity: suggestion
    detect: cast_size
    params: {max_speaking_per_page: 0.6, min_pages: 20}
    principle: >
      Every speaking part is a contract, a fitting, and a day on a call
      sheet. A speaking cast that grows faster than the page count is a
      budget fact worth surfacing while it is still cheap to fix.
    source: ProdConv

  - id: C024
    name: Lead absent for a long stretch
    tier: 2
    category: structure
    severity: suggestion
    detect: lead_absence_gap
    params: {max_gap_ratio: 0.25, min_scenes: 8}
    principle: >
      The character with the most dialogue disappearing for a quarter of the
      script is measurable, not a matter of taste. It is usually a subplot
      that grew during a rewrite.
    source: Field; ProdConv

  - id: C025
    name: Dialogue share imbalance
    tier: 2
    category: production
    severity: suggestion
    detect: dialogue_share
    params: {max_share: 0.45, min_speakers: 4, min_lines: 40}
    principle: >
      One character holding most of the lines in an ensemble is a structural
      fact with casting consequences. It may be the design; it should not be
      a surprise.
    source: ProdConv

  # ---- place and time --------------------------------------------------
  - id: C004
    name: Day/night whiplash
    tier: 2
    category: consistency
    severity: warning
    detect: day_night_whiplash
    principle: >
      Consecutive scenes that flip DAY -> NIGHT -> DAY at the same location
      without a time cue usually indicate a continuity error rather than an
      intended time jump.
    source: ProdConv (continuity practice)

  - id: C005
    name: Location name inconsistency
    tier: 2
    category: consistency
    severity: warning
    detect: location_drift
    params: {similarity_threshold: 0.82}
    principle: >
      The same physical place must keep the same slugline name for the whole
      script; near-duplicate location strings split one set into two.
    source: ProdConv (breakdown practice)

  - id: C009
    name: Same location shot both INT. and EXT.
    tier: 2
    category: consistency
    severity: suggestion
    detect: int_ext_conflict
    principle: >
      A location that appears as both an interior and an exterior is either
      two different sets sharing a name, or one set that needs INT./EXT. on
      both headings. Left alone it is scheduled twice.
    source: ProdConv

  - id: C010
    name: CONTINUOUS across a location change
    tier: 2
    category: consistency
    severity: warning
    detect: continuous_across_locations
    principle: >
      CONTINUOUS means the action runs unbroken from the previous scene. Used
      across an unrelated location it asserts a continuity that the geography
      does not support.
    source: Riley; ProdConv

  - id: C011
    name: Consecutive scenes that should be one
    tier: 2
    category: consistency
    severity: suggestion
    detect: mergeable_scenes
    principle: >
      Two scenes in a row at the same location and the same time of day, with
      no transition between them, are one scene that was split by an edit.
    source: ProdConv

  - id: C019
    name: Location abbreviation drift
    tier: 2
    category: consistency
    severity: warning
    detect: abbreviation_drift
    principle: >
      A place written out in one heading and abbreviated in another
      (APARTMENT vs APT., HOSPITAL vs HOSP.) is one set that will appear
      twice on a breakdown.
    source: ProdConv

  - id: C021
    name: Distinct location count relative to length
    tier: 2
    category: production
    severity: suggestion
    detect: location_load
    params: {max_per_page: 1.15, min_pages: 20}
    principle: >
      Distinct locations drive company moves, and company moves drive
      schedule. Counting them early turns an invisible cost into a number.
      The conventional figure of 0.35 per page sat near the 5th percentile of
      produced practice and flagged 88% of 1,082 screenplays, so it described
      almost every document rather than an unusual one. The value here is the
      90th percentile of that corpus; the median runs 0.67.
    source: ProdConv; measured, see docs/research/threshold-results.md

  - id: C022
    name: Night-scene share
    tier: 2
    category: production
    severity: suggestion
    detect: night_ratio
    params: {max_ratio: 0.6, min_scenes: 15}
    principle: >
      Night shooting costs more per page than day shooting. The share of
      night scenes is a measurable property of the draft, and it is far
      cheaper to notice now than in prep.
    source: ProdConv

  - id: C023
    name: Runaway scene length
    tier: 2
    category: production
    severity: warning
    detect: scene_length
    params: {max_pages: 4.0}
    principle: >
      A single scene running several pages is a shooting day on one set and a
      long stretch without a cut. It may be the design; it should be a
      deliberate one.
    source: Goldman; ProdConv

  # ---- structural continuity -------------------------------------------
  - id: C014
    name: Unclosed FLASHBACK
    tier: 2
    category: consistency
    severity: error
    detect: unclosed_flashback
    principle: >
      A flashback that opens must close (END FLASHBACK, BACK TO PRESENT, or
      an equivalent). Without a close, every scene after it is ambiguous in
      time.
    source: Riley; ProdConv

  - id: C015
    name: Unclosed MONTAGE or SERIES OF SHOTS
    tier: 2
    category: consistency
    severity: error
    detect: unclosed_montage
    principle: >
      A montage is a bounded block. An opening marker with no END MONTAGE
      leaves the reader unsure where normal scene time resumes.
    source: Riley; ProdConv

  - id: C016
    name: Unclosed INTERCUT
    tier: 2
    category: consistency
    severity: warning
    detect: unclosed_intercut
    principle: >
      An INTERCUT sets up cross-cutting between two established locations and
      needs an END INTERCUT or a new heading to end it. Otherwise the cut
      pattern runs to the end of the script.
    source: Riley; ProdConv

  - id: C026
    name: Capitalised prop introduced and never used
    tier: 2
    category: consistency
    severity: suggestion
    detect: unpaid_prop
    params: {min_length: 4}
    principle: >
      Capitalising a prop tells the art department to build it and the reader
      to remember it. One that never returns is either a promise the script
      does not keep or a capital that should be lowercase.
    source: McKee (setup and payoff, reworded); ProdConv

  - id: C027
    name: Series regular introduced late in a pilot
    tier: 2
    category: structure
    severity: suggestion
    detect: late_series_regular
    params: {introduce_before: 0.5, min_scenes: 3}
    profiles: [tv-pilot]
    principle: >
      A pilot's job is to introduce the cast the series will run on. A
      character who recurs heavily but first speaks past the midpoint was
      probably meant to arrive earlier.
    source: TVConv

  # =====================================================================
  # TIER 3: LLM RUBRIC JUDGES
  # Soft rules. One scoped rubric per rule, built from this YAML. Zero code.
  # Every finding must carry verbatim evidence that the caller re-verifies.
  # =====================================================================

  # ---- craft ------------------------------------------------------------
  - id: S001
    name: Unfilmable interiority in action lines
    tier: 3
    category: craft
    severity: warning
    scope: window
    principle: >
      Action lines may only contain what a camera can photograph or a
      microphone can record. Thoughts, memories, backstory, and feelings that
      have no visible behavior are unfilmable and must be externalized.
    source: Trottier; McKee
    examples:
      - bad: "Maya stares at the letter. She remembers the summer her father left and wonders if she ever forgave him."
        good: "Maya stares at the letter. Her thumb worries the torn edge. She almost opens it. Doesn't."
      - bad: "John is secretly furious but decides to hide it."
        good: "John smiles. His knuckles whiten around the glass."

  - id: S002
    name: On-the-nose dialogue
    tier: 3
    category: craft
    severity: suggestion
    scope: window
    principle: >
      Characters should not state their emotions, motives, or the subtext
      outright. Dialogue works when what is said sits at an angle to what is
      meant.
    source: McKee
    examples:
      - bad: "I am very angry with you because you betrayed my trust when you told Sarah my secret."
        good: "Sarah says hi, by the way. She knew things about me only one person knew."

  - id: S003
    name: Exposition dump
    tier: 3
    category: craft
    severity: suggestion
    scope: window
    principle: >
      Backstory and world information should be released only when the scene
      needs it, ideally inside conflict, and never as characters reciting
      facts they both already know for the audience's benefit.
    source: McKee (exposition as ammunition, reworded)
    examples:
      - bad: "As you know, brother, since Dad died five years ago the factory has been losing money and the bank owns half of it."
        good: "The bank called again. / Let them. / They asked for you by name this time."

  - id: S004
    name: Scene enters early, exits late
    tier: 3
    category: craft
    severity: suggestion
    scope: window
    principle: >
      Enter each scene at the last possible moment and leave at the first;
      greetings, arrivals, and goodbyes that carry no conflict are dead
      weight.
    source: Goldman; SpecConv
    examples:
      - bad: "Hi. / Hey, come in. / Coffee? / Sure, black. / So... you wanted to talk?"
        good: "Scene opens mid-argument, coffee already cold on the table."

  - id: S005
    name: Passive protagonist stretch
    tier: 3
    category: structure
    severity: suggestion
    scope: document
    principle: >
      Across any sustained stretch, the protagonist should be making choices
      that cause the next scene, not merely receiving events. Watching things
      happen is not a story engine.
    source: Field; McKee
    examples:
      - bad: "Hero is told the plan, driven to the location, rescued when it fails."
        good: "Hero picks the lock herself; the alarm she trips creates act three."

  - id: S006
    name: Late or absent inciting disruption
    tier: 3
    category: structure
    severity: suggestion
    scope: document
    principle: >
      Something must disrupt the protagonist's ordinary world within roughly
      the first ten to fifteen pages; if the status quo survives past that,
      the read stalls.
    source: Field; Snyder (beat placement, reworded)

  - id: S007
    name: Interchangeable character voices
    tier: 3
    category: craft
    severity: suggestion
    scope: document
    principle: >
      Cover the cue names and you should still know who is speaking. If any
      two characters' lines could be swapped without loss, their voices are
      not yet differentiated.
    source: McKee; SpecConv

  - id: S008
    name: Unmotivated or unrelated detail
    tier: 3
    category: craft
    severity: suggestion
    scope: document
    principle: >
      Every prop, detail, or aside the script spends words on creates an
      expectation of payoff. Flag conspicuous details that never return and
      digressions unrelated to the scene's purpose.
    source: McKee (setup/payoff causality, reworded)

  - id: S009
    name: Scene in which nothing turns
    tier: 3
    category: craft
    severity: suggestion
    scope: window
    principle: >
      A scene should end in a different state from the one it began in:
      someone learns something, loses something, or commits to something. A
      scene that ends exactly where it started is information, not drama.
    source: McKee (scene as the unit of change, reworded)
    examples:
      - bad: "Two detectives review the case file, agree it is strange, and go home."
        good: "Two detectives review the case file. One of them recognises the handwriting and says nothing."

  - id: S010
    name: Interview-shaped dialogue
    tier: 3
    category: craft
    severity: suggestion
    scope: window
    principle: >
      Dialogue built as a run of questions answered directly is an interview,
      not a scene. Characters who want something deflect, change the subject,
      and answer the question they wish had been asked.
    source: McKee; Goldman
    examples:
      - bad: "Where were you? / At work. / Until when? / Ten. / Did anyone see you? / My manager."
        good: "Where were you? / You've got the receipt in your hand. / I want to hear you say it."

  - id: S011
    name: Dialogue restating what we just watched
    tier: 3
    category: craft
    severity: suggestion
    scope: window
    principle: >
      When a line describes an action the audience has just seen, the script
      is paying twice for the same beat. Trust the image.
    source: Goldman; McKee
    examples:
      - bad: "He drops the glass. It shatters. JOHN: I dropped the glass. It broke."
        good: "He drops the glass. It shatters. JOHN: That was my mother's."

  - id: S012
    name: The same information delivered twice
    tier: 3
    category: craft
    severity: suggestion
    scope: document
    principle: >
      A fact the audience already has does not need restating in a later
      scene unless something about the restatement is new. Repetition without
      change reads as a rewrite seam.
    source: McKee (progressive complications, reworded)

  - id: S013
    name: Monologue without resistance
    tier: 3
    category: craft
    severity: suggestion
    scope: window
    principle: >
      A long speech holds only when someone in the scene is trying to stop
      it. An uninterrupted monologue delivered to a silent listener is the
      writer talking, not the character.
    source: McKee; Goldman

  - id: S014
    name: Character introduced without a distinguishing detail
    tier: 3
    category: craft
    severity: suggestion
    scope: document
    principle: >
      A first appearance should give the reader one specific thing to hold
      onto: a behaviour, an object, a way of occupying the space. A name and
      an age alone leave the character a blank.
    source: Trottier; Snyder (audience empathy, reworded)
    examples:
      - bad: "SARAH (30s) enters the room."
        good: "SARAH (30s) enters carrying her own chair, and puts it where she wants it."

  - id: S015
    name: Characters naming each other too often
    tier: 3
    category: craft
    severity: suggestion
    scope: window
    principle: >
      People rarely use each other's names mid-conversation. Names sprinkled
      through dialogue are the writer reminding the reader who is speaking,
      which the cue already does.
    source: SpecConv
    examples:
      - bad: "Look, John, I told you, John, this isn't about the money."
        good: "I told you. It isn't about the money."

  - id: S016
    name: Appearance detail that narrows casting without cause
    tier: 3
    category: production
    severity: suggestion
    scope: window
    principle: >
      Physical description should be limited to what the story actually
      requires. Detail beyond that closes casting doors for no dramatic
      return, and is usually habit rather than intent.
    source: ProdConv

  - id: S017
    name: Performance directed inside action lines
    tier: 3
    category: craft
    severity: suggestion
    scope: window
    principle: >
      Action lines describe behaviour, not the reading of a line. Adverbs of
      delivery placed in action ("he says, bitterly") direct the actor from
      the wrong element.
    source: Trottier; McKee
    examples:
      - bad: "He answers her sarcastically, clearly hurt by the accusation."
        good: "He answers without looking up. Keeps stacking the plates."

  - id: S018
    name: Voice-over carrying what the scene should show
    tier: 3
    category: craft
    severity: suggestion
    scope: window
    principle: >
      Voice-over is a legitimate device when it says what the images cannot.
      When it narrates what is already on screen, it replaces the scene
      instead of layering it.
    source: McKee; SpecConv

  - id: S019
    name: Act-out that does not turn
    tier: 3
    category: structure
    severity: suggestion
    scope: document
    profiles: [tv-pilot]
    principle: >
      An act break should land on a reversal, a revelation, or a decision
      that makes the audience need the next act. An act that ends on a
      conversation winding down gives them permission to stop watching.
    source: TVConv; Snyder (beat placement, reworded)

  - id: S020
    name: Code-mixed dialogue inconsistent within a character
    tier: 3
    category: language
    severity: suggestion
    scope: document
    profiles: [indian-regional]
    principle: >
      In a code-mixed script, how much a character switches languages is
      characterisation: class, education, region, who they are talking to. A
      character whose mix changes with no situational reason reads as
      inconsistent rather than bilingual.
    source: INConv; McKee (character voice, reworded)

  # ---- language ---------------------------------------------------------
  - id: L001
    name: Tense drift in action lines
    tier: 3
    category: language
    severity: warning
    scope: window
    principle: >
      Action is written in present tense, always. Past-tense action lines
      break the convention that a screenplay describes what the audience is
      watching right now.
    source: Trottier; SpecConv
    examples:
      - bad: "John walked to the window and looked outside."
        good: "John walks to the window. Looks outside."

  - id: L002
    name: Spelling and typo sweep
    tier: 3
    category: language
    severity: warning
    scope: window
    principle: >
      Flag probable misspellings and typos, but respect screenwriting style:
      sentence fragments, ALL-CAPS emphasis on sounds/props, and invented
      proper nouns used consistently are not errors.
    source: SpecConv
    profile_notes:
      indian-regional: >
        Dialogue here is routinely Telugu, Hindi, or Tamil written in Latin
        letters (Tenglish, Hinglish). There is no standard romanisation, so a
        word absent from an English dictionary is the normal case and never a
        typo on its own. Judge only the English prose in action lines and
        sluglines. Within transliterated dialogue, flag nothing unless the
        same word is spelled two ways in the same speech, which is
        inconsistency rather than spelling.

  - id: L003
    name: Passive voice in action lines
    tier: 3
    category: language
    severity: suggestion
    scope: window
    principle: >
      Action should name the agent and the verb in that order. The passive
      voice hides who is doing what, which is exactly the information a
      department head reads the action line to find.
    source: Trottier; ProdConv
    examples:
      - bad: "The door is opened by a woman in a raincoat."
        good: "A woman in a raincoat opens the door."

  - id: L004
    name: Adverb dependence in action
    tier: 3
    category: language
    severity: suggestion
    scope: window
    principle: >
      An adverb attached to a weak verb is a stronger verb waiting to be
      found. "Walks slowly" is not a shot; "drags" is.
    source: Trottier
    examples:
      - bad: "She quickly and nervously puts the letter away."
        good: "She shoves the letter under the mattress."

  - id: L005
    name: Hedging verbs before the action
    tier: 3
    category: language
    severity: suggestion
    scope: window
    principle: >
      "Begins to", "starts to", and "proceeds to" put a frame between the
      reader and the action. The camera does not photograph beginning to
      stand; it photographs standing.
    source: Trottier
    examples:
      - bad: "He begins to walk toward the car and starts to open the door."
        good: "He walks to the car. Opens the door."

  - id: L006
    name: Novelistic prose beyond the frame
    tier: 3
    category: language
    severity: suggestion
    scope: window
    principle: >
      Similes, metaphors, and authorial asides that cannot be photographed
      belong to prose. A screenplay's description is a shot list in
      sentences.
    source: Trottier; McKee
    examples:
      - bad: "The house sat like a wounded animal on the hill, remembering better decades."
        good: "The house. Roof caved on one side. Paint gone to bare wood."

  - id: L007
    name: Unfilmable sensory description
    tier: 3
    category: language
    severity: suggestion
    scope: window
    principle: >
      Smell, taste, and temperature reach the audience only through what they
      can see or hear. Describe the behaviour the sensation causes, not the
      sensation.
    source: Trottier; McKee
    examples:
      - bad: "The kitchen smells of burnt garlic and the tiles are freezing underfoot."
        good: "Smoke curls off the pan. She crosses the tiles on her toes, fast."

  - id: L008
    name: Untranslated dialogue not marked for subtitles
    tier: 3
    category: language
    severity: warning
    scope: window
    principle: >
      Dialogue in a language other than the script's primary language must be
      marked with a parenthetical naming the language, a subtitle note, or a
      bracketed translation. Unmarked, it is unshootable and untranslatable.
    source: Riley; ProdConv
    examples:
      - bad: "RAJU: Nuvvu ekkada unnavu?"
        good: "RAJU (in Telugu, subtitled): Nuvvu ekkada unnavu?"
    profile_notes:
      indian-regional: >
        The script's own language is the regional one, so transliterated
        dialogue is the default and needs no marking. What needs marking here
        is the reverse: a switch into a language the audience is not assumed
        to follow, and any dialogue the film intends to subtitle on screen.

  # ---- profile: production load (added with the metrics layer) ---------
  - id: C028
    name: Company moves relative to scene count
    tier: 2
    category: production
    severity: suggestion
    detect: company_moves
    params: {max_ratio: 0.99, min_scenes: 25}
    principle: >
      A company move is a change of location between consecutive scenes, and
      it is the single biggest lever on a shooting day. When almost every
      scene sits at a different place from the one before it, the schedule is
      being written by scene order rather than by geography. Measured across
      1,082 produced screenplays the median is 0.96, so "almost every scene"
      turns out to describe almost every screenplay: the old 0.85 flagged 96%
      of them. The value here is the 90th percentile, and the honest reading
      is that this measure barely separates one draft from another.
    source: ProdConv; measured, see docs/research/threshold-results.md

  - id: C029
    name: Set used for a single fraction of a page
    tier: 2
    category: production
    severity: suggestion
    detect: single_use_location
    params: {max_pages: 0.5, min_locations: 12}
    principle: >
      A location that carries less than half a page still costs a scout, a
      permit, a move, and a lighting setup. Several of them together is
      usually a sequence that could play in one place already in the script.
    source: ProdConv

  - id: C030
    name: Character carried by a single long scene
    tier: 2
    category: production
    severity: suggestion
    detect: one_scene_wonder
    params: {min_lines: 12}
    principle: >
      A speaker with a substantial part confined to one scene is a full
      casting process, a fitting, and a day for a role the audience meets
      once. Worth knowing before the part is offered.
    source: ProdConv

  - id: F047
    name: Scene runs under an eighth of a page
    tier: 1
    category: production
    severity: suggestion
    detect: sliver_scene
    params: {min_eighths: 1, min_scenes: 20}
    principle: >
      A scene shorter than one eighth of a page still takes a slugline, a
      scene number, a strip on the board, and a setup. Some are deliberate
      cutaways; a run of them usually wants to be one scene with a montage
      header.
    source: ProdConv

  - id: F048
    name: Dialogue with no action anywhere in the scene
    tier: 1
    category: format
    severity: suggestion
    detect: unstaged_scene
    params: {min_lines: 8}
    principle: >
      A scene of pure speech with no action line gives the director no
      staging, the actors no business, and the reader no picture. Even one
      line of what the room is doing anchors it.
    source: Trottier; McKee

  # =====================================================================
  # TIER 1: PROSE INSIDE THE ELEMENTS
  # How the writing is set, as opposed to which element it is. Handlers in
  # lint/tier1_style.py.
  # =====================================================================

  - id: F049
    name: Dialogue set entirely in capitals
    tier: 1
    category: format
    severity: warning
    detect: dialogue_in_caps
    params: {min_words: 3, max_per_page: 0.5, min_count: 5}
    principle: >
      A speech is set in sentence case whatever its volume. Capitals in
      dialogue are a volume knob the page does not have, they survive no
      format conversion intact, and the actor decides how loud the line is.
      Measured as a rate, because plenty of produced drafts do this on purpose
      and the habit is the note rather than each instance.
    source: Trottier; Riley

  - id: F050
    name: Numeral left in dialogue
    tier: 1
    category: format
    severity: suggestion
    detect: numerals_in_dialogue
    params: {max_per_page: 0.5, min_count: 5}
    principle: >
      A number an actor speaks is written the way it is spoken. Years, clock
      times, and codes stay as digits because those are read as themselves;
      a bare quantity is spelled out. Measured as a rate, because a script
      about a season has numbers in it and the habit is the note, not each
      instance.
    source: Riley; SpecConv

  - id: F051
    name: Parenthetical that stages an action
    tier: 1
    category: format
    severity: suggestion
    detect: stage_direction_parenthetical
    principle: >
      A parenthetical says how a line is delivered. Movement, business, and
      anything the camera would see belong in an action line, where the
      director and the actor can both find them.
    source: Trottier; Riley

  - id: F052
    name: Beat and pause parentheticals overused
    tier: 1
    category: format
    severity: suggestion
    detect: beat_overuse
    params: {max_per_page: 0.5, min_count: 5}
    principle: >
      A beat that changes the scene belongs in the action, where it can be
      played. Used as punctuation between every other line it stops meaning
      anything and starts costing the reader a line of page.
    source: Trottier; Goldman

  - id: F053
    name: (CONT'D) marked on some resumed speeches and not others
    tier: 1
    category: format
    severity: suggestion
    detect: missing_contd
    principle: >
      When action interrupts a speech and the same character carries on, the
      second cue is marked (CONT'D). A draft that never marks any has made a
      choice the software will undo on the next repagination. A draft that
      marks some and not others leaves a reader unable to tell a resumed
      speech from a new thought, which is the defect this reports.
    source: Riley; Trottier

  - id: F054
    name: First appearance not set in capitals
    tier: 1
    category: format
    severity: suggestion
    detect: first_appearance_not_capitalised
    params: {min_lines: 2, min_count: 2}
    principle: >
      A speaking character is capitalised the first time they appear in a
      description, and in lower case every time after. It is the only signal
      on the page that tells a reader they are meeting somebody new.
    source: Trottier; Riley; SpecConv

  - id: F055
    name: Unbalanced quotation marks
    tier: 1
    category: format
    severity: warning
    detect: unbalanced_quotes
    principle: >
      A quote opened and never closed swallows everything after it in any
      tool that reads quoted spans, and it is invisible while reading because
      the eye supplies the missing mark. The sibling of the bracket check.
    source: SpecConv

  - id: F056
    name: Script does not close on an ending marker
    tier: 1
    category: format
    severity: suggestion
    detect: no_ending_marker
    params: {min_pages: 5}
    principle: >
      A screenplay ends on FADE OUT, THE END, or an equivalent. Without one,
      a reader cannot tell a finished draft from a truncated file, and that
      is the exact doubt a submission cannot afford.
    source: Trottier; SpecConv

  - id: F057
    name: Two transitions in a row
    tier: 1
    category: format
    severity: warning
    detect: consecutive_transitions
    principle: >
      One cut takes one transition. A pair stacked together is a leftover
      from an edit, and it makes the page ambiguous about where the scene
      actually breaks.
    source: Riley

  - id: F058
    name: Title or super card written without a colon
    tier: 1
    category: format
    severity: suggestion
    detect: title_card_format
    principle: >
      Text that appears on screen is introduced with SUPER:, TITLE:, or
      CHYRON: and the words that appear. Without the colon the line reads as
      description of a thing in the room rather than as text over the image.
    source: Riley; ProdConv

  - id: F059
    name: Montage header with nothing under it
    tier: 1
    category: format
    severity: warning
    detect: montage_without_items
    params: {min_items: 2}
    principle: >
      A montage is a list of shots. A header with one beat or none under it
      is either an ordinary scene wearing the wrong hat or a sequence that
      never got written.
    source: Riley; ProdConv

  - id: F060
    name: Run of blank lines
    tier: 1
    category: format
    severity: suggestion
    detect: blank_line_run
    params: {max_blank: 2}
    principle: >
      One blank line separates two elements. Longer gaps are page spacing
      that the software adds and removes on its own, and they move every
      element on the page when it does.
    source: SpecConv

  - id: F061
    name: Mixed line endings
    tier: 1
    category: format
    severity: warning
    detect: mixed_line_endings
    principle: >
      A file that carries both CRLF and LF endings breaks diffs, breaks some
      readers, and renders stray endings as blank lines in others. Normalise
      to one.
    source: SpecConv

  - id: F062
    name: Scene heading ends in punctuation
    tier: 1
    category: format
    severity: suggestion
    detect: heading_trailing_punctuation
    principle: >
      A heading is a label rather than a sentence, so it carries no closing
      punctuation. The stray character travels into every breakdown that
      keys on the heading text.
    source: Riley; ProdConv

  - id: F063
    name: Two places joined by a slash in a heading
    tier: 1
    category: format
    severity: suggestion
    detect: slash_in_heading
    principle: >
      Sub-locations are separated by a spaced hyphen, which is what tells a
      scheduler that one place sits inside another. A slash makes two sets
      look like one string.
    source: Riley; ProdConv

  - id: F064
    name: Character cue running to several words
    tier: 1
    category: format
    severity: warning
    detect: overlong_cue
    params: {max_words: 5}
    principle: >
      A cue is a name. Anything longer sitting in the cue position is almost
      always an action line that lost its capitals, and it enters the
      character registry as a person who does not exist.
    source: Trottier; ProdConv

  - id: F065
    name: Two parentheticals with no line between them
    tier: 1
    category: format
    severity: suggestion
    detect: double_parenthetical
    principle: >
      A parenthetical modifies the line under it. Two in a row means the
      first one modifies nothing, and the actor has to guess which of them
      applies.
    source: Trottier

  - id: F066
    name: POV with nobody to own it
    tier: 1
    category: format
    severity: suggestion
    detect: pov_without_owner
    principle: >
      A point of view belongs to somebody. Unowned, it tells the camera crew
      nothing and the reader less, and it is usually a shot the description
      could carry on its own.
    source: Riley

  - id: F067
    name: Sound written as an SFX tag
    tier: 1
    category: format
    severity: suggestion
    detect: sound_cue_tag
    principle: >
      Sound is written into the description in capitals, where it reads as
      part of the scene. SFX: is a post-production label and does not belong
      in a screenplay element.
    source: Riley; ProdConv

  - id: F068
    name: INT and INT. used in the same document
    tier: 1
    category: format
    severity: suggestion
    detect: int_ext_punctuation_drift
    principle: >
      Whichever prefix style a script uses, it uses one. Breakdown software
      keys on the exact string, so a document carrying both produces two
      populations of scene it cannot reconcile.
    source: Riley; ProdConv

  - id: F069
    name: Extension with no space before it
    tier: 1
    category: format
    severity: suggestion
    detect: cue_extension_spacing
    principle: >
      An extension is separated from the name by a space. Written flush
      against it, the whole string enters the registry as the character's
      name and the same person appears twice.
    source: Riley

  - id: F070
    name: Spacing around punctuation
    tier: 1
    category: format
    severity: suggestion
    detect: punctuation_spacing
    params: {min_count: 3}
    principle: >
      A space before a comma or a full stop, or none after one, is almost
      always the residue of a PDF or OCR round trip rather than a choice. It
      is invisible while reading and obvious to every parser downstream.
    source: SpecConv

  - id: F071
    name: Word written twice in a row
    tier: 1
    category: format
    severity: warning
    detect: repeated_word
    principle: >
      A doubled word is a typo the eye reads straight past, which is exactly
      why it survives to a submitted draft. Grammatical doubles are
      excluded.
    source: SpecConv

  - id: F072
    name: Speaker attributed the way a play does
    tier: 1
    category: format
    severity: warning
    detect: playscript_speaker_style
    principle: >
      A screenplay cues a speaker on its own line above the speech, never as
      NAME: text on one line. The stage and transcript form leaves every
      speech invisible to the character registry, so cast counts and
      breakdowns come out empty.
    source: Trottier; Riley

  # =====================================================================
  # TIER 2: THE CAST AS A GRAPH, AND REFERENCE DECAY
  # Handlers in lint/tier2_story.py.
  #
  # The reference-decay rules below check one thing only: does the document
  # come back to what it introduced? That is internal consistency, the same
  # class as an unpaid prop, and it is verifiable by pointing at the page.
  # Whether a story RESOLVES well is a judgement this project does not make,
  # in any tier.
  # =====================================================================

  - id: C031
    name: One name written with two different apostrophes
    tier: 2
    category: consistency
    severity: error
    detect: apostrophe_drift
    principle: >
      A typewriter apostrophe and a typographic one look identical on paper
      and are different characters to every registry in the pipeline. One
      character or one set then counts as two, in the cast list, in the
      schedule, and in every check this linter runs. Nobody catches it by
      reading and the fix is one find and replace.
    source: ProdConv

  - id: C032
    name: Speaking part who never shares a scene
    tier: 2
    category: consistency
    severity: warning
    detect: isolated_character
    params: {min_lines: 2, min_cast: 3}
    principle: >
      A relationship the audience never watches being played is a
      relationship that has only been described. A speaking part who is
      never in a room with another speaking part is usually a voice-over or
      a phone call whose extension was never written.
    source: ProdConv; McKee

  - id: C033
    name: Cast splits into groups who never meet
    tier: 2
    category: consistency
    severity: warning
    detect: disconnected_cast
    params: {min_group: 2, min_cast: 5}
    principle: >
      Read as a graph of who shares a scene with whom, a cast should connect.
      Two groups with no scene between them are two casts, which is usually
      two drafts that were merged or a strand that needs one shared scene to
      join the film it is in.
    source: ProdConv

  - id: C034
    name: Set carried for several scenes then abandoned
    tier: 2
    category: production
    severity: suggestion
    detect: dropped_location
    params: {min_scenes: 3, last_seen_before: 0.6}
    principle: >
      A location built for three or more scenes and then never returned to
      or even named again is either a thread that stopped or a set that two
      later scenes could have moved into. Both are worth knowing before it
      is scouted.
    source: ProdConv

  - id: C035
    name: Capitalised thing named repeatedly then dropped
    tier: 2
    category: consistency
    severity: suggestion
    detect: dropped_thread
    params: {min_mentions: 3, last_seen_before: 0.6, min_scenes: 8}
    principle: >
      Something the script capitalised and came back to three times reads as
      planted. If the document never refers to it again, either it is paid
      off somewhere the page does not show or the capitals are doing work
      the story stopped doing.
    source: ProdConv; Goldman

  - id: C036
    name: Lead with no age anywhere on the page
    tier: 2
    category: consistency
    severity: suggestion
    detect: unaged_principal
    params: {top: 5}
    principle: >
      Casting reads a screenplay for four facts about each part, and age is
      the one that decides who is sent the script at all. One parenthetical
      at the first appearance settles it for the whole document.
    source: ProdConv; Trottier

  - id: C037
    name: Substantial part cued by a role rather than a name
    tier: 2
    category: production
    severity: suggestion
    detect: unnamed_principal
    params: {min_lines: 15}
    principle: >
      WAITER with two lines is a role. WAITER with forty is a part that gets
      cast, fitted, and called to set by name for weeks, and every one of
      those steps wants a name to hang on. Numbered variants count as the
      same role, because SECURITY GUARD 2 is no more named than SECURITY
      GUARD.
    source: ProdConv

  - id: C038
    name: Too many speaking parts in the opening
    tier: 2
    category: craft
    severity: suggestion
    detect: crowded_opening
    params: {opening_share: 0.1, max_cast: 23, min_scenes: 20}
    principle: >
      A reader can hold only so many new names before they start turning back
      pages. Names arriving faster than that in the opening cost comprehension
      for the whole draft, whatever happens later. The taught figure is about
      half a dozen; across 1,082 produced screenplays the median opening tenth
      introduces eleven speaking parts, and a ceiling of eight flagged 65% of
      them. The value here is the 90th percentile of that corpus. The teaching
      is about what a reader can hold, and the measurement says produced
      screenplays routinely ask for more, which is worth reporting either way.
    source: Field; Snyder; measured, see docs/research/threshold-results.md

  - id: C039
    name: Substantial part arriving very late
    tier: 2
    category: craft
    severity: suggestion
    detect: late_principal
    params: {after: 0.75, min_lines: 8}
    profiles: [us-spec-feature, shooting-script, indian-regional]
    principle: >
      A character who first speaks in the last quarter and then carries a
      substantial part has to earn their place from nothing while the story
      is closing. Usually one earlier line of planting is all it needs.
    source: Field; McKee

  - id: C040
    name: Scene with only one voice in it
    tier: 2
    category: consistency
    severity: suggestion
    detect: lone_speaker_scene
    params: {min_lines: 6}
    principle: >
      A long stretch of speech with one cue and no extension anywhere in the
      scene usually means the reply was written and the cue was lost. If the
      character really is alone, or the other side is a phone, the page
      should say so with (V.O.) or (O.S.).
    source: Trottier; ProdConv

  # =====================================================================
  # TIER 3: LOOSE ENDS
  # Reference continuity that needs reading rather than counting. Every one
  # of these asks the same question a tier-2 rule asks (does the document
  # come back to this?) about something only a reader can identify. All are
  # suggestions, all require verbatim evidence of the setup, and none of
  # them judges whether the story is any good.
  # =====================================================================

  - id: S021
    name: Question raised in dialogue and never returned to
    tier: 3
    category: craft
    severity: suggestion
    scope: document
    principle: >
      A question a character puts to the story, as opposed to a question
      answered in the next line, sets an expectation the document should
      come back to. Flag only questions that are given weight and then never
      referred to again anywhere in the provided text.
    source: Field; McKee
    examples:
      - bad: "MAYA: Who signed the release form? (never mentioned again in the script)"
        good: "MAYA: Who signed the release form? ... later ... MAYA: You signed it. I checked."
      - bad: "SAM: What happened to the money? (the money never appears again)"
        good: "SAM: What happened to the money? ... later ... The bag sits on the table, empty."

  - id: S022
    name: Detail planted and never used
    tier: 3
    category: craft
    severity: suggestion
    scope: document
    principle: >
      An object, an ability, or a fact given deliberate attention creates an
      expectation of use. Flag a plant that gets a beat of its own and then
      never returns. Do not flag ordinary set dressing, and do not speculate
      about how it should have been paid off.
    source: Goldman; McKee
    examples:
      - bad: "She unlocks the drawer and looks at the revolver for a long moment. (the revolver never appears again)"
        good: "She unlocks the drawer and looks at the revolver. ... later ... The drawer is open. The revolver is gone."

  - id: S023
    name: Strand of scenes that stops without a closing beat
    tier: 3
    category: craft
    severity: suggestion
    scope: document
    principle: >
      A run of scenes following one situation should either resolve or be
      deliberately left open. Flag a strand that simply stops being written
      about. Quote the last scene of the strand as evidence.
    source: Field; McKee
    examples:
      - bad: "Three scenes build the eviction hearing, and after page 60 it is never referred to again."
        good: "Three scenes build the eviction hearing; the last one ends with the notice served."

  - id: S024
    name: Stated intention never referred to again
    tier: 3
    category: craft
    severity: suggestion
    scope: document
    principle: >
      When a character says out loud what they are going to do, the document
      should either show it, contradict it, or have somebody notice it did
      not happen. Flag the stated intention that vanishes with none of those.
    source: McKee
    examples:
      - bad: "RAJU: Tomorrow I sell the shop. (the shop is never mentioned again)"
        good: "RAJU: Tomorrow I sell the shop. ... later ... The shutter is down. The board is gone."

  - id: S025
    name: Character leaves the story without an exit beat
    tier: 3
    category: craft
    severity: suggestion
    scope: document
    principle: >
      A character built up across several scenes and then simply absent
      reads as an oversight rather than a choice. Flag the last appearance
      only when it carries no sense of ending and nobody refers to them
      afterwards.
    source: McKee; Snyder
    examples:
      - bad: "PRIYA drives four scenes in the first act, then never appears or is mentioned again."
        good: "PRIYA drives four scenes, and her last one closes on the door shutting behind her."

  - id: S026
    name: Answer to a question the scene never asked
    tier: 3
    category: craft
    severity: suggestion
    scope: document
    principle: >
      Information delivered before the story has given the audience a reason
      to want it lands as an announcement. Flag a speech that supplies a
      fact nothing in the preceding scenes has made anyone curious about.
    source: McKee; Goldman
    examples:
      - bad: "ANIL: As you know, our father left the mill to me in 1994 after the flood."
        good: "ANIL: You want the mill. ... DEVI: Father left it to you. ... ANIL: After the flood."

  - id: S027
    name: Reversal announced rather than played
    tier: 3
    category: craft
    severity: suggestion
    scope: window
    principle: >
      When a scene turns, the turn should happen in front of the audience.
      Flag a scene where the change is reported in dialogue after the fact
      instead of being staged.
    source: McKee
    examples:
      - bad: "SAM: So then I told him no and he backed down completely."
        good: "SAM: No. ... A long silence. The man steps back."

  - id: S028
    name: Entrance nobody in the scene reacts to
    tier: 3
    category: craft
    severity: suggestion
    scope: window
    principle: >
      A character walking into a scene changes it. Flag an entrance the
      scene absorbs without a single beat of reaction, where the arrival was
      built up enough that the absence reads as a missing beat.
    source: McKee; Goldman
    examples:
      - bad: "The door opens. RAVI walks in. NALINI keeps talking about the bus timetable."
        good: "The door opens. RAVI walks in. NALINI stops mid-sentence."

  - id: S029
    name: Time passing that the page never signals
    tier: 3
    category: craft
    severity: suggestion
    scope: window
    principle: >
      When the story jumps forward, the page has to say so, in a heading, in
      a line of description, or in dialogue. Flag a jump the reader can only
      infer from a changed situation.
    source: Riley; McKee
    examples:
      - bad: "The scene before ends at the hospital; the next opens with the child walking, with nothing to mark the years."
        good: "SUPER: FOUR YEARS LATER"

  - id: S030
    name: Character present in a scene who never speaks or acts
    tier: 3
    category: craft
    severity: suggestion
    scope: window
    principle: >
      Somebody the description puts in a room and then never gives a line, a
      reaction, or a piece of business is a person the scene forgot. Flag
      only where the character was named on entry into that scene.
    source: McKee; ProdConv
    examples:
      - bad: "MEENA, ARJUN and their mother sit down to eat. Meena and Arjun argue for two pages. (the mother is never referred to again in the scene)"
        good: "MEENA, ARJUN and their mother sit down to eat. ... Their mother sets down her spoon. They stop."

# =====================================================================
# GENRE SIGNATURES
#
# Not a verdict. Every entry below is a set of bands over measurements the
# metrics layer takes from the page: what share of scenes are night, how much
# of the document is dialogue, how fast the scenes turn over. A script is
# scored by how many bands it sits inside, and the per-signal evidence is
# always shown, so a reader can disagree with any single band and see exactly
# what it changed.
#
# Genre is an observable category rather than a judgment of quality, which is
# why this is allowed to exist here at all. Nothing below says a script is
# good, or that it should be one genre rather than another.
#
# PROVENANCE, stated plainly: these bands are starting heuristics drawn from
# how each form is conventionally taught and from what the shape of the page
# implies about shooting it. They are NOT measured from a labelled corpus,
# because no freely licensed corpus of that kind exists yet. Treat a match as
# a prompt to look, never as a fact. They are data precisely so they can be
# replaced by measured values the day a corpus does exist.
# =====================================================================

genres:
  comedy:
    name: Comedy
    signals:
      short_exchange_ratio: [0.55, 1.0]
      dialogue_ratio: [0.5, 1.0]
      night_ratio: [0.0, 0.4]
      avg_scene_pages: [0.0, 1.4]
      dread_word_density: [0.0, 0.6]
    principle: >
      Comedy lives on the turn between two lines, so its speeches are short
      and its scenes end early. It is written daytime and interior far more
      often than not, because the joke needs the room lit.

  drama:
    name: Drama
    signals:
      dialogue_ratio: [0.45, 1.0]
      avg_scene_pages: [0.8, 3.0]
      cast_per_page: [0.0, 0.45]
      action_word_density: [0.0, 0.8]
      short_exchange_ratio: [0.0, 0.7]
    principle: >
      Drama gives a scene room to turn, so scenes run longer and the cast
      stays small enough that each speaker is developed rather than used.

  action:
    name: Action or thriller
    signals:
      action_word_density: [0.8, 100.0]
      dialogue_ratio: [0.0, 0.55]
      exterior_ratio: [0.25, 1.0]
      scenes_per_page: [0.6, 100.0]
      locations_per_page: [0.2, 100.0]
    principle: >
      Action is carried in description rather than speech, moves between more
      places, and turns scenes over faster than a script that talks.

  horror:
    name: Horror
    signals:
      night_ratio: [0.4, 1.0]
      dread_word_density: [0.8, 100.0]
      dialogue_ratio: [0.0, 0.55]
      cast_per_page: [0.0, 0.4]
      avg_scene_pages: [0.0, 2.0]
    principle: >
      Horror is written at night with a small cast in few places, and it
      spends its description on what cannot be seen clearly.

  romance:
    name: Romance
    signals:
      intimacy_word_density: [0.5, 100.0]
      dialogue_ratio: [0.5, 1.0]
      cast_per_page: [0.0, 0.5]
      action_word_density: [0.0, 0.5]
      night_ratio: [0.0, 0.5]
    principle: >
      Romance keeps two people in the frame and lets them talk, so its
      description carries touch and reaction rather than event.

# Bands a script is measured against for its declared profile. Same caveat as
# above: conventional teaching, not a measured distribution. Page bands are the
# most defensible of these because they are enforced by readers in practice.
#
# LANGUAGE, stated plainly: these numbers describe screenplays written in
# English, and the page-a-minute convention they rest on is an English-language
# typesetting result. A page of Telugu or Hindi dialogue does not run for the
# same time, and the indian-regional bands below widen the page count without
# claiming to have measured anything. Read every band here as "for English
# scripts" unless a measured alternative replaces it.
comparables:
  us-spec-feature:
    pages: [90, 120]
    scene_count: [40, 130]
    speaking_cast: [8, 35]
    location_count: [15, 60]
    night_share: [0.0, 0.45]
  tv-pilot:
    pages: [28, 68]
    scene_count: [20, 70]
    speaking_cast: [6, 25]
    location_count: [6, 30]
    night_share: [0.0, 0.5]
  shooting-script:
    pages: [90, 130]
    scene_count: [40, 160]
    speaking_cast: [8, 45]
    location_count: [15, 70]
    night_share: [0.0, 0.5]
  indian-regional:
    pages: [110, 165]
    scene_count: [60, 200]
    speaking_cast: [15, 60]
    location_count: [25, 90]
    night_share: [0.0, 0.5]
